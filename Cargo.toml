[package]
name = "snapcap"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Cross-platform screenshot and screen recorder"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui-phosphor = "0.14"
xcap = "0.9"
openh264 = "0.9"
fdk-aac = "0.8"
mp4 = "0.14"
gif = "0.14"
color_quant = "2"
png = "0.18"
# ksni = pure-Rust StatusNotifierItem tray on Linux (no GTK/appindicator needed).
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
global-hotkey = "0.8"
arboard = { version = "3.6", features = ["wayland-data-control"] }
dirs = "7"
chrono = "0.4"
crossbeam-channel = "0.5"
open = "5"
rfd = "0.17"
interprocess = "2.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
bytes = "1"
skrifa = "0.44"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies.cpal]
version = "0.18"
features = ["pulseaudio"]

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
# COM-based shell drag and drop for dragging captures out to other apps.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
